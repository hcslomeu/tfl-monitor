[project]
name = "tfl-monitor"
version = "0.0.1"
description = "Live TfL (Transport for London) monitor API with a conversational agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.28",
    "pydantic>=2.9",
    "langchain-anthropic>=1.4",
    "langgraph>=1.0",
    "langsmith>=0.1",
    "anthropic>=0.96",
    "logfire[fastapi,httpx]>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.7",
    "openapi-spec-validator>=0.7",
    "taskipy>=1.14",
    # scripts/fetch_tfl_samples.py reads TFL_APP_KEY from .env
    "python-dotenv>=1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-mermaid2-plugin>=1.2",
    "mkdocs-glightbox>=0.4",
    "mkdocs-minify-plugin>=0.8",
    "pymdown-extensions>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/ingestion", "src/api", "contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["scripts/"]

[[tool.mypy.overrides]]
module = [
    "langchain_anthropic",
    "langchain_anthropic.*",
    "langchain_core.*",
    "langgraph",
    "langgraph.*",
]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: requires live services (TfL, Anthropic); opt in with -m integration",
    "slow: spends real LLM budget; opt in with -m 'integration and slow'",
]

[tool.taskipy.tasks]
# --exitfirst-on-collection-errors via Python wrapper: treat "no tests collected" (exit 5) as success.
# Works on both POSIX shells and Windows PowerShell.
test = "python -c \"import subprocess, sys; sys.exit(0 if subprocess.call(['pytest']) in (0, 5) else 1)\""
lint = "ruff check . && ruff format --check . && mypy src contracts"
fmt = "ruff check --fix . && ruff format ."
api = "uvicorn api.main:app --reload --app-dir src"
# Loads .env so TFL_APP_KEY (and TFL_DEBUG_PROXY=1 when set) reach the
# process, letting the Swagger UI proxy real TfL calls without manual
# key entry. Local dev only — do not use in production.
api-debug = "uvicorn api.main:app --reload --app-dir src --env-file .env"
docs-serve = "mkdocs serve --config-file mkdocs.yml --dev-addr 127.0.0.1:8001"
docs-build = "mkdocs build --config-file mkdocs.yml --strict"

[tool.vercel]
# Vercel Python runtime entrypoint (ADR 015). The module path is the file
# path; its `api.*` imports resolve to the wheel Vercel installs from uv.lock.
entrypoint = "src.api.main:app"
